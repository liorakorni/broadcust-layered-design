service: broadcust-layered-design
frameworkVersion: '4'

provider:
  name: aws
  # x86_64, unlike the arm64 sibling services: Playwright's Chromium builds are
  # far better supported here (SPEC section 3).
  architecture: x86_64
  region: us-east-1
  deploymentBucket:
    name: serverless-framework-deployments-us-east-1-b707af47-ecca
  environment:
    JOBS_TABLE: ${self:service}-${sls:stage}-jobs
    ARTIFACT_BUCKET: ${self:service}-${sls:stage}-artifacts
    STAGE_FUNCTION_NAME: ${self:service}-${sls:stage}-stage
    WORKFLOW_ARN: !Ref LayeredDesignWorkflow
    # Phase B feature flag. Deploy with `--param="layoutFirst=true"` to enable the
    # layout-first flow (designFlow: layout-first); off by default.
    LAYOUT_FIRST_ENABLED: ${param:layoutFirst, 'false'}
    CODE_SHAPES_ENABLED: ${param:codeShapes, 'true'}
    OPENAI_API_KEY: ${file(./config.${sls:stage}.json):openai_api_key}
    # Only the ARN is an environment variable; the credentials themselves are
    # read from Secrets Manager at cold start, so they never appear in the
    # console, in GetFunctionConfiguration or in CloudFormation state, and a
    # rotated key takes effect without a redeploy.
    CLOUDINARY_SECRET_ARN: ${file(./config.${sls:stage}.json):cloudinary_secret_arn}
    # Each stage uploads to its own folder so dev jobs never mix with
    # production assets in the shared Cloudinary account.
    CLOUDINARY_FOLDER: layered-design-${sls:stage}
  ecr:
    images:
      layered_design_image:
        path: ./
        platform: linux/amd64
        # Docker 25+ attaches provenance/SBOM attestations, producing a manifest
        # list that Lambda rejects. Same workaround as the sibling repos.
        buildOptions:
          - --provenance=false
          - --sbom=false

custom:
  # Empty (or absent from config) means no Bedrock agent is allowed to invoke
  # the API function; the service works the same either way.
  bedrockAgentArn: ${file(./config.${sls:stage}.json):bedrock_agent_arn, ''}

functions:
  api:
    name: ${self:service}-${sls:stage}-api
    image:
      name: layered_design_image
      command:
        - handler_api.handler
    memorySize: 512
    # Explicit export invokes the stage Lambda (browser render) synchronously.
    timeout: 60
    role: ApiRole

  stage:
    name: ${self:service}-${sls:stage}-stage
    image:
      name: layered_design_image
      command:
        - handler_stage.handler
    memorySize: 2048
    timeout: 240
    ephemeralStorageSize: 2048
    role: StageRole

resources:
  Conditions:
    # Deployments without an agent configured still succeed; the permission is
    # simply absent. Nothing in the handler knows the agent exists.
    HasBedrockAgent: !Not [!Equals ['${self:custom.bedrockAgentArn}', '']]

  Resources:
    # --- Storage ------------------------------------------------------------
    JobsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-jobs
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    ArtifactBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-artifacts
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            # Only objects tagged lifecycle=temporary expire. Every object is
            # written temporary; FINALIZE retags a saved design's objects as
            # retained (lib/artifacts.retain), so saved designs are never
            # deleted. Failed jobs never retag, so their artifacts expire.
            - Id: expire-temporary-artifacts
              Status: Enabled
              Prefix: layered-design/
              TagFilters:
                - Key: lifecycle
                  Value: temporary
              ExpirationInDays: 30

    # --- IAM: least privilege, one role per function ------------------------
    ApiRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-api-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: api-job-access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt JobsTable.Arn
                # Start jobs and read results, but never write artifacts.
                - Effect: Allow
                  Action: states:StartExecution
                  Resource: !Ref LayeredDesignWorkflow
                - Effect: Allow
                  Action: states:DescribeExecution
                  Resource:
                    !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${self:service}-${sls:stage}-workflow:*'
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub '${ArtifactBucket.Arn}/layered-design/*'
                # The API persists the canonical request so every stage reads
                # identical bytes regardless of retries. That is the only thing
                # it writes, so the grant is scoped to that one stage prefix
                # rather than to the whole job tree.
                # PutObjectTagging is required because every write carries the
                # lifecycle=temporary tag.
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource:
                    !Sub '${ArtifactBucket.Arn}/layered-design/*/ACCEPT_REQUEST/*'
                # Interactive edits (lib/design_edit.py) write only immutable design
                # snapshots, again scoped to one stage prefix.
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource:
                    !Sub '${ArtifactBucket.Arn}/layered-design/*/DESIGN_STATE/*'
                # Explicit export renders on the stage Lambda, which owns the browser.
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource:
                    !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-stage'

    # Lets the configured Bedrock agent, and only that agent in this account,
    # invoke the API function as an Action Group (SPEC 7.8).
    BedrockInvokeApiPermission:
      Type: AWS::Lambda::Permission
      Condition: HasBedrockAgent
      Properties:
        FunctionName: !GetAtt ApiLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: bedrock.amazonaws.com
        SourceAccount: !Ref AWS::AccountId
        SourceArn: ${self:custom.bedrockAgentArn}

    StageRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-stage-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: stage-artifact-access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # PutObjectTagging covers both the initial lifecycle=temporary
                # tag on write and FINALIZE's retag of a saved design.
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:PutObjectTagging
                  Resource: !Sub '${ArtifactBucket.Arn}/layered-design/*'
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt JobsTable.Arn
                # Scoped to the one secret this service needs, not to
                # secretsmanager:* - a stage Lambda running model-authored
                # content should not be able to read every secret in the account.
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ${file(./config.${sls:stage}.json):cloudinary_secret_arn}

    WorkflowRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-workflow-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: states.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: invoke-stage
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource:
                    !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-stage'
                - Effect: Allow
                  Action:
                    - dynamodb:UpdateItem
                  Resource: !GetAtt JobsTable.Arn

    # --- Workflow -----------------------------------------------------------
    LayeredDesignWorkflow:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: ${self:service}-${sls:stage}-workflow
        StateMachineType: STANDARD
        RoleArn: !GetAtt WorkflowRole.Arn
        Definition: ${file(./workflow.asl.json)}
        DefinitionSubstitutions:
          StageFunctionArn:
            !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-stage'
          JobsTable: ${self:service}-${sls:stage}-jobs

  Outputs:
    ArtifactBucketName:
      Value: !Ref ArtifactBucket
    JobsTableName:
      Value: !Ref JobsTable
    WorkflowArn:
      Value: !Ref LayeredDesignWorkflow
    ApiFunctionName:
      Value: ${self:service}-${sls:stage}-api
